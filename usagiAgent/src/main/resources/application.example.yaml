spring:
  application:
    name: UsagiAgent
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    url: jdbc:postgresql://localhost:5432/usagiAgent
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email
    password: your-password # 邮箱授权码
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  ai:
    deepseek:
      api-key: your-api-key
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
    zhipuai:
      api-key: your-api-key
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        options:
          model: glm-4.6
mybatis:
  type-aliases-package: com.buaa.usagi.model.entity
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.buaa.usagi.typehandler

document:
  storage:
    base-path: ./data/documents

# B 站视频分析（可选配置）
# 填登录 B 站后的 Cookie（取 SESSDATA=xxx 一段即可），可解锁视频 AI 字幕；
# 不填则仅能获取 up 主上传的 CC 字幕与简介时间戳目录。
bilibili:
  cookie: ""

